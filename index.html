<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM NIWAS - Circulars & Memos Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Ensuring strict table borders matching government portal aesthetics */
        table, th, td { border: 1px solid #cbd5e1; }
    </style>
</head>
<body class="bg-amber-50/30 min-h-screen text-slate-800 font-sans antialiased">

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="text-center mb-6">
            <h2 class="text-xl font-bold tracking-wider text-amber-900 uppercase inline-block border-b-2 border-amber-700 pb-1">
                CIRCULARS & MEMOS
            </h2>
        </div>

        <div class="bg-[#fdfcf7] rounded-md border border-amber-200/60 p-3 mb-6 text-sm shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-4">
                
                <div class="flex items-center gap-2 flex-1 min-w-[180px]">
                    <label for="filter-category" class="text-sky-900 font-medium whitespace-nowrap">Category</label>
                    <select id="filter-category" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs focus:outline-sky-600">
                        <option value="-ALL-">-ALL-</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 flex-1 min-w-[200px]">
                    <label for="filter-order" class="text-sky-900 font-medium whitespace-nowrap">Order No.</label>
                    <input type="text" id="filter-order" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs focus:outline-sky-600" placeholder="Search ID...">
                </div>

                <div class="flex items-center gap-2 flex-[1.5] min-w-[240px]">
                    <label for="filter-subject" class="text-sky-900 font-medium whitespace-nowrap">Subject</label>
                    <input type="text" id="filter-subject" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs focus:outline-sky-600" placeholder="Search text in notices or details...">
                </div>

                <div id="counter-badge" class="text-xs font-semibold text-sky-800 bg-sky-50 border border-sky-200 px-2.5 py-1 rounded">
                    0 Items
                </div>
            </div>
        </div>

        <div id="status-message" class="text-center py-8 text-slate-500 text-sm italic">
            Connecting to data streams...
        </div>

        <div id="table-wrapper" class="overflow-x-auto rounded border border-slate-300 shadow-xs hidden">
            <table class="w-full border-collapse bg-white text-left text-sm">
                <thead>
                    <tr class="bg-sky-700 text-white font-semibold text-xs tracking-wider">
                        <th class="p-3 w-[20%]">Circular / Memo / Order No.</th>
                        <th class="p-3 w-[12%]">Date</th>
                        <th class="p-3 w-[12%]">Category</th>
                        <th class="p-3 w-[44%]">Subject / Details</th>
                        <th class="p-3 w-[12%] text-center">Download</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-200 text-slate-700">
                    </tbody>
            </table>
        </div>

    </main>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRb6eyiMJOIdAx5K2p1mieQdPRrfWmJaZwFhjkqanjEau2Z5DNbs0g1GofVt8bVpqTulEX_91KTpvE_/pub?gid=1532868234&single=true&output=csv';

        let allNotices = [];

        // Engine parsing engine that accounts for strings with quotes and internal commas safely
        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            
            const headers = lines[0].map(h => h.trim());
            return lines.slice(1).map(line => {
                let obj = {};
                headers.forEach((header, index) => {
                    obj[header] = line[index] ? line[index].trim() : '';
                });
                return obj;
            });
        }

        // Populates Category choices safely based on items present in data rows
        function populateCategories(data) {
            const dropdown = document.getElementById('filter-category');
            const categories = new Set();
            
            data.forEach(item => {
                if(item['Type']) categories.add(item['Type']);
            });

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                dropdown.appendChild(opt);
            });
        }

        // Render routine
        function displayData(items) {
            const tbody = document.getElementById('table-body');
            const wrapper = document.getElementById('table-wrapper');
            const status = document.getElementById('status-message');
            document.getElementById('counter-badge').innerText = `${items.length} Item(s) found`;

            tbody.innerHTML = '';

            if (items.length === 0) {
                wrapper.classList.add('hidden');
                status.classList.remove('hidden');
                status.innerText = "⚠️ No records match the filtered criteria.";
                return;
            }

            status.classList.add('hidden');
            wrapper.classList.remove('hidden');

            items.forEach((item, index) => {
                const tr = document.createElement('tr');
                // Alternating row styling matching your uploaded table format background tints
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-slate-50' : 'bg-sky-50/40 hover:bg-slate-50';

                // Parsing download anchor column parameters
                let downloadContent = `<span class="text-slate-400 italic text-xs">No link</span>`;
                if (item['Download'] && (item['Download'].startsWith('http://') || item['Download'].startsWith('https://'))) {
                    downloadContent = `
                        <a href="${item['Download']}" target="_blank" rel="noopener noreferrer" 
                           class="text-sky-700 hover:text-sky-900 font-medium underline text-xs inline-flex items-center justify-center gap-1">
                           Download <span class="text-[10px] text-slate-400">⬇</span>
                        </a>`;
                }

                // Building rows to match your targets exactly:
                // Column 1: Order No. | Column 2: Date | Column 3: Type | Column 4: Notice + Details | Column 5: Link
                tr.innerHTML = `
                    <td class="p-3 font-mono text-xs text-slate-700 font-medium">${item['Order No.'] || '—'}</td>
                    <td class="p-3 text-xs text-slate-600 whitespace-nowrap">${item['Date'] || '—'}</td>
                    <td class="p-3 text-xs"><span class="font-medium">${item['Type'] || 'General'}</span></td>
                    <td class="p-3 text-xs leading-relaxed">
                        <div class="font-bold text-slate-900 mb-1">${item['Notice'] || ''}</div>
                        <div class="text-slate-600 whitespace-pre-line text-[13px]">${item['Details'] || ''}</div>
                    </td>
                    <td class="p-3 text-center whitespace-nowrap">${downloadContent}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Filter Controller Processor Engine
        function runFilters() {
            const catVal = document.getElementById('filter-category').value;
            const orderVal = document.getElementById('filter-order').value.toLowerCase().trim();
            const subjectVal = document.getElementById('filter-subject').value.toLowerCase().trim();

            const filtered = allNotices.filter(item => {
                const matchesCat = (catVal === '-ALL-') || (item['Type'] === catVal);
                const matchesOrder = !orderVal || (item['Order No.'] && item['Order No.'].toLowerCase().includes(orderVal));
                
                const matchesSubject = !subjectVal || 
                    (item['Notice'] && item['Notice'].toLowerCase().includes(subjectVal)) ||
                    (item['Details'] && item['Details'].toLowerCase().includes(subjectVal));

                return matchesCat && matchesOrder && matchesSubject;
            });

            displayData(filtered);
        }

        // Initialize execution on load
        async function loadDashboard() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("Could not download file data pipeline updates.");
                
                const textData = await response.text();
                allNotices = parseCSV(textData);

                populateCategories(allNotices);
                displayData(allNotices);

                // Event listener assignments for filtering
                document.getElementById('filter-category').addEventListener('change', runFilters);
                document.getElementById('filter-order').addEventListener('input', runFilters);
                document.getElementById('filter-subject').addEventListener('input', runFilters);

            } catch (err) {
                console.error(err);
                document.getElementById('status-message').innerText = "❌ Unable to sync data. Verify your internet access configurations.";
            }
        }

        loadDashboard();
    </script>
</body>
</html>
