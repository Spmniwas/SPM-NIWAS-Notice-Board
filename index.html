<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM NIWAS - Digital Notice Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f4f6f9] min-h-screen text-[#333333] antialiased">

    <header class="bg-[#0062cc] text-white shadow-xs px-6 py-6 mb-6">
        <div class="max-w-7xl mx-auto flex items-center gap-4">
            <div class="bg-white p-2.5 rounded-md flex items-center justify-center shadow-xs">
                <span class="text-2xl">📌</span>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight">SPM NIWAS Notice Board</h1>
                <p class="text-blue-100 text-sm font-medium mt-0.5">Interactive Dashboard</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-12">
        
        <div class="bg-white rounded-lg shadow-xs border border-slate-200/80 p-5 mb-6 text-sm">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-5 items-end">
                
                <div class="space-y-1.5">
                    <label for="filter-category" class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Category</label>
                    <select id="filter-category" class="w-full bg-white border border-slate-300 rounded-md px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#0062cc]/20 focus:border-[#0062cc]">
                        <option value="-ALL-">All Categories</option>
                    </select>
                </div>

                <div class="space-y-1.5 md:col-span-2">
                    <label for="filter-subject" class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Search Notices</label>
                    <input type="text" id="filter-subject" class="w-full bg-white border border-slate-300 rounded-md px-3 py-2 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#0062cc]/20 focus:border-[#0062cc]" placeholder="Type any keyword (e.g., Policy, Vacancy, Admin)...">
                </div>

                <div class="flex items-center justify-end">
                    <button id="reset-filters" type="button" class="w-full md:w-auto px-4 py-2 text-xs font-semibold text-[#0062cc] bg-blue-50 border border-blue-200 rounded-md hover:bg-blue-100/70 transition-colors cursor-pointer text-center">
                        Clear Filters
                    </button>
                </div>

            </div>
        </div>

        <div id="status-message" class="text-center py-12 text-slate-500 text-sm font-medium">
            <span class="animate-pulse">Fetching records from live calendar system...</span>
        </div>

        <div id="table-wrapper" class="bg-white rounded-lg border border-slate-200 shadow-xs overflow-hidden hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-[14px] border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold text-xs uppercase tracking-wider">
                            <th class="p-4 w-[15%]">Date</th>
                            <th class="p-4 w-[15%]">Category</th>
                            <th class="p-4 w-[55%]">Subject Title</th>
                            <th class="p-4 w-[15%] text-center">Link</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-slate-700">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRb6eyiMJOIdAx5K2p1mieQdPRrfWmJaZwFhjkqanjEau2Z5DNbs0g1GofVt8bVpqTulEX_91KTpvE_/pub?gid=1532868234&single=true&output=csv';

        let allNotices = [];

        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            
            const headers = lines[0].map(h => h.trim());
            return lines.slice(1).map(line => {
                let obj = {};
                headers.forEach((header, index) => {
                    obj[header] = line[index] ? line[index].trim() : '';
                });
                return obj;
            });
        }

        // Standardizes date parameters to process accurate reverse-chronological sorting rules
        function parseSheetDate(dateStr) {
            if (!dateStr) return new Date(0); // Pushes empty fields to bottom
            const parts = dateStr.split('-');
            if (parts.length !== 3) return new Date(0);

            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1; 
            let year = parseInt(parts[2], 10);

            if (year < 100) year += 2000;
            return new Date(year, month, day);
        }

        function populateCategories(data) {
            const dropdown = document.getElementById('filter-category');
            const categories = new Set();
            
            data.forEach(item => {
                if(item['Type']) categories.add(item['Type']);
            });

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                dropdown.appendChild(opt);
            });
        }

        function displayData(items) {
            const tbody = document.getElementById('table-body');
            const wrapper = document.getElementById('table-wrapper');
            const status = document.getElementById('status-message');

            tbody.innerHTML = '';

            if (items.length === 0) {
                wrapper.classList.add('hidden');
                status.classList.remove('hidden');
                status.innerText = "🔍 No notices matching your selected criteria were found.";
                return;
            }

            status.classList.add('hidden');
            wrapper.classList.remove('hidden');

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors group";

                // Setup Action Button Links styled exactly like "Submit Nomination" from screenshot
                let actionBtn = `<span class="text-slate-400 italic text-xs">No attachment</span>`;
                if (item['Download'] && (item['Download'].startsWith('http://') || item['Download'].startsWith('https://'))) {
                    actionBtn = `
                        <a href="${item['Download']}" target="_blank" rel="noopener noreferrer" 
                           class="inline-block bg-white text-[#0062cc] text-xs font-medium px-3 py-1.5 rounded border border-[#cbd5e1] hover:bg-[#0062cc] hover:text-white hover:border-[#0062cc] shadow-2xs transition-all text-center whitespace-nowrap">
                           Download Document
                        </a>`;
                }

                // Sub-text tracking layout rules: Order number sits safely 1 point step down from standard text size
                const subTextOrder = item['Order No.'] ? `ID: ${item['Order No.']}` : '—';

                tr.innerHTML = `
                    <td class="p-4 text-slate-600 font-medium whitespace-nowrap align-middle">
                        ${item['Date'] || '—'}
                    </td>
                    
                    <td class="p-4 align-middle">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-800 border border-slate-200/60">
                           📌 ${item['Type'] || 'General'}
                        </span>
                    </td>
                    
                    <td class="p-4 align-middle">
                        <div class="font-semibold text-slate-900 leading-snug text-[14px]">
                            ${item['Notice'] || 'Untitled Notification'}
                        </div>
                        <div class="text-[12px] text-slate-400 font-mono mt-1 tracking-tight">
                            ${subTextOrder}
                        </div>
                    </td>
                    
                    <td class="p-4 text-center align-middle">
                        ${actionBtn}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function runFilters() {
            const catVal = document.getElementById('filter-category').value;
            const subjectVal = document.getElementById('filter-subject').value.toLowerCase().trim();

            const filtered = allNotices.filter(item => {
                const matchesCat = (catVal === '-ALL-') || (item['Type'] === catVal);
                
                const matchesSubject = !subjectVal || 
                    (item['Notice'] && item['Notice'].toLowerCase().includes(subjectVal)) ||
                    (item['Order No.'] && item['Order No.'].toLowerCase().includes(subjectVal)) ||
                    (item['Details'] && item['Details'].toLowerCase().includes(subjectVal));

                return matchesCat && matchesSubject;
            });

            displayData(filtered);
        }

        async function loadDashboard() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("Connection block hitting server.");
                
                const textData = await response.text();
                const parsedData = parseCSV(textData);

                // Chronological Sorting Pipeline Execution (Latest Date First)
                allNotices = parsedData.sort((a, b) => {
                    return parseSheetDate(b['Date']) - parseSheetDate(a['Date']);
                });

                populateCategories(allNotices);
                displayData(allNotices);

                // Wire Up Interactive Form Listeners
                document.getElementById('filter-category').addEventListener('change', runFilters);
                document.getElementById('filter-subject').addEventListener('input', runFilters);

                document.getElementById('reset-filters').addEventListener('click', () => {
                    document.getElementById('filter-category').value = '-ALL-';
                    document.getElementById('filter-subject').value = '';
                    displayData(allNotices);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('status-message').innerHTML = `
                    <div class="text-red-500 font-semibold">❌ Stream Fetching Failure.</div>
                    <p class="text-xs text-slate-400 mt-1">Verify spreadsheet gateway connections are live.</p>
                `;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
