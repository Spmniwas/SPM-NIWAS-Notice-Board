<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM NIWAS - Notice Board Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Ensuring strict table borders matching portal aesthetics */
        table, th, td { border: 1px solid #cbd5e1; }
    </style>
</head>
<body class="bg-amber-50/30 min-h-screen text-slate-800 font-sans antialiased">

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="text-center mb-6">
            <h2 class="text-xl font-bold tracking-wider text-amber-900 uppercase inline-block border-b-2 border-amber-700 pb-1">
                SPM NIWAS NOTICE BOARD
            </h2>
        </div>

        <div class="bg-[#fdfcf7] rounded-md border border-amber-200/60 p-3 mb-6 text-sm shadow-xs">
            <div class="flex flex-wrap items-center gap-y-4 gap-x-6">
                
                <div class="flex items-center gap-2 flex-1 min-w-[150px]">
                    <label for="filter-category" class="text-sky-900 font-medium whitespace-nowrap">Category</label>
                    <select id="filter-category" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs focus:outline-sky-600">
                        <option value="-ALL-">-ALL-</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 flex-1 min-w-[150px]">
                    <label for="filter-order" class="text-sky-900 font-medium whitespace-nowrap">Order No.</label>
                    <input type="text" id="filter-order" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs focus:outline-sky-600" placeholder="Search ID...">
                </div>

                <div class="flex items-center gap-2 flex-[1.2] min-w-[200px]">
                    <label for="filter-subject" class="text-sky-900 font-medium whitespace-nowrap">Subject</label>
                    <input type="text" id="filter-subject" class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs focus:outline-sky-600" placeholder="Search notices...">
                </div>

                <div class="flex items-center gap-3 bg-slate-100/60 px-3 py-1 rounded border border-slate-200 min-w-[320px]">
                    <span class="text-sky-900 font-medium whitespace-nowrap">Date:</span>
                    
                    <div class="flex items-center gap-1.5">
                        <label for="filter-date-from" class="text-xs text-slate-500">From</label>
                        <input type="date" id="filter-date-from" class="bg-white border border-slate-300 rounded px-1.5 py-0.5 text-xs focus:outline-sky-600">
                    </div>

                    <div class="flex items-center gap-1.5">
                        <label for="filter-date-to" class="text-xs text-slate-500">To</label>
                        <input type="date" id="filter-date-to" class="bg-white border border-slate-300 rounded px-1.5 py-0.5 text-xs focus:outline-sky-600">
                    </div>
                    
                    <button id="clear-dates" type="button" class="text-[11px] text-red-600 hover:text-red-800 font-medium underline cursor-pointer ml-1">Clear</button>
                </div>

            </div>
        </div>

        <div id="status-message" class="text-center py-8 text-slate-500 text-sm italic">
            Connecting to data streams...
        </div>

        <div id="table-wrapper" class="overflow-x-auto rounded border border-slate-300 shadow-xs hidden">
            <table class="w-full border-collapse bg-white text-left text-[14px]">
                <thead>
                    <tr class="bg-sky-700 text-white font-semibold tracking-wider text-[14px]">
                        <th class="p-3 w-[22%]">Circular / Memo / Order No.</th>
                        <th class="p-3 w-[12%]">Date</th>
                        <th class="p-3 w-[12%]">Category</th>
                        <th class="p-3 w-[42%]">Subject</th>
                        <th class="p-3 w-[12%] text-center">Download</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-200 text-slate-700">
                    </tbody>
            </table>
        </div>

    </main>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRb6eyiMJOIdAx5K2p1mieQdPRrfWmJaZwFhjkqanjEau2Z5DNbs0g1GofVt8bVpqTulEX_91KTpvE_/pub?gid=1532868234&single=true&output=csv';

        let allNotices = [];

        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            
            const headers = lines[0].map(h => h.trim());
            return lines.slice(1).map(line => {
                let obj = {};
                headers.forEach((header, index) => {
                    obj[header] = line[index] ? line[index].trim() : '';
                });
                return obj;
            });
        }

        // Helper function converting DD-MM-YY or DD-MM-YYYY strings to JavaScript Date objects safely
        function parseSheetDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('-');
            if (parts.length !== 3) return null;

            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1; // JS Month starts at 0
            let year = parseInt(parts[2], 10);

            // Handle shorthand two-digit year entries (e.g., '26' -> 2026)
            if (year < 100) {
                year += 2000;
            }

            return new Date(year, month, day);
        }

        function populateCategories(data) {
            const dropdown = document.getElementById('filter-category');
            const categories = new Set();
            
            data.forEach(item => {
                if(item['Type']) categories.add(item['Type']);
            });

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                dropdown.appendChild(opt);
            });
        }

        function displayData(items) {
            const tbody = document.getElementById('table-body');
            const wrapper = document.getElementById('table-wrapper');
            const status = document.getElementById('status-message');

            tbody.innerHTML = '';

            if (items.length === 0) {
                wrapper.classList.add('hidden');
                status.classList.remove('hidden');
                status.innerText = "⚠️ No records match the filtered criteria.";
                return;
            }

            status.classList.add('hidden');
            wrapper.classList.remove('hidden');

            items.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-slate-50' : 'bg-sky-50/40 hover:bg-slate-50';

                let downloadContent = `<span class="text-slate-400 italic text-xs">No link</span>`;
                if (item['Download'] && (item['Download'].startsWith('http://') || item['Download'].startsWith('https://'))) {
                    downloadContent = `
                        <a href="${item['Download']}" target="_blank" rel="noopener noreferrer" 
                           class="text-sky-700 hover:text-sky-900 font-medium underline text-[14px] inline-flex items-center justify-center gap-1">
                           Download <span class="text-[11px] text-slate-400">⬇</span>
                        </a>`;
                }

                const noticeDetails = item['Details'] ? item['Details'] : 'No supplementary details available for this record.';

                tr.innerHTML = `
                    <td class="p-3 font-mono font-medium text-slate-700">${item['Order No.'] || '—'}</td>
                    <td class="p-3 text-slate-600 whitespace-nowrap">${item['Date'] || '—'}</td>
                    <td class="p-3"><span class="font-medium">${item['Type'] || 'General'}</span></td>
                    <td class="p-3 relative group cursor-help">
                        <div class="font-bold text-slate-900 group-hover:text-sky-800 transition-colors">
                            ${item['Notice'] || 'Untitled Notification'}
                        </div>
                        <div class="absolute left-3 right-3 mt-1 hidden group-hover:block z-50 bg-slate-900 text-slate-100 text-[13px] p-4 rounded-lg shadow-xl border border-slate-700 whitespace-pre-line leading
